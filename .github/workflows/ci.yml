name: Pull request checks

on:
  pull_request:
    # ready_for_review runs the suite once a draft flips to ready. Draft PRs (the
    # loop skills push one commit per step to a draft) skip every job below.
    types: [opened, synchronize, reopened, ready_for_review]
    # Filter individual jobs, not the workflow, so required checks are reported.

permissions:
  contents: read

concurrency:
  group: pull-request-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  changes:
    name: Change scope
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      application: ${{ steps.scope.outputs.application }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Classify the entire pull request
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/change-scope.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: changes
    # A missing output or failed classifier must run the full suite.
    if: ${{ !cancelled() && !github.event.pull_request.draft && (needs.changes.result != 'success' || needs.changes.outputs.application != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
      # A production build must remain independent of a reachable database.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run typecheck:storybook
      - run: npm run typecheck:prototype
      - run: npm run build-storybook

  lint:
    name: Lint
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check agent instruction routes and budgets
        run: node scripts/check-agent-routes.mjs
      - name: Test CI change classification
        run: node --test scripts/ci/change-scope.test.mjs
      - run: npm ci --include=optional
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.application != 'false' }}
      - run: npm run lint
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.application != 'false' }}

  unit:
    name: Unit tests
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (needs.changes.result != 'success' || needs.changes.outputs.application != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
      - run: npm run test:unit:coverage
      - run: npm run test:prototype
      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage-${{ github.run_id }}
          path: coverage/unit/
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Integration tests
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (needs.changes.result != 'success' || needs.changes.outputs.application != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The auth configuration for the app under test (a per-run SESSION_SECRET,
    # AUTH_IDENTITY_ADAPTER=mock and MAILER_ADAPTER=log, this allowlist) is set by
    # tests/integration/environment.ts, which owns child configuration. The worker
    # also needs INTEGRATION_TEST_RUN=1 because its job selects mock payments.
    # The allowlist is repeated here so
    # this file visibly holds only a fake address: real operator emails live in
    # deployment configuration alone. The Build job deliberately sets no auth env —
    # a production build must not need any.
    env:
      INTEGRATION_TEST_RUN: '1'
      OPERATOR_EMAILS: mock-operator@devmentor.test
      PLATFORM_CURRENCY: 'PLN'
      PLATFORM_PRICE_BOUNDS: '{"p25":{"minCents":8000,"maxCents":60000},"p50":{"minCents":16000,"maxCents":120000}}'
      INVITATION_TTL_DAYS: '14'
      MENTOR_PUBLISH_WINDOW_DAYS: '14'
      PAYMENT_GATEWAY_ADAPTER: 'mock'
      STRIPE_SECRET_KEY: ''
      STRIPE_WEBHOOK_SECRET: ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional

      - name: Cache agent-browser Chrome
        uses: actions/cache@v5
        with:
          path: ~/.agent-browser
          key: agent-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            agent-browser-${{ runner.os }}-

      - name: Install agent-browser Chrome and Linux dependencies
        run: npm run test:browser:install:ci

      # Testcontainers owns the ephemeral PostgreSQL instance. The integration
      # global setup migrates/seeds it, builds and boots Next.js, waits for a
      # database-ready health response, and cleans up every process/container.
      - run: npm run test:integration

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-evidence-${{ github.run_id }}
          path: test-results/integration/
          if-no-files-found: ignore
          retention-days: 7
