name: Pull request checks

on:
  pull_request:
    # ready_for_review runs the suite once a draft flips to ready. Draft PRs (the
    # loop skills push one commit per step to a draft) skip every job below.
    types: [opened, synchronize, reopened, ready_for_review]
    # Skip PRs that only touch agent working notes. Specs, AGENTS.md and other
    # Markdown stay checked: the agent-route check validates them. GitHub filters
    # on the whole PR diff, so this never skips a PR that also changes code.
    paths-ignore:
      - '.ai/runs/**'
      - '.ai/qa/**'
      - '.ai/analysis/**'
      - '.ai/lessons.md'
      - '.ai/lessons/**'

permissions:
  contents: read

concurrency:
  group: pull-request-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Build
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
      # A production build must remain independent of a reachable database.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run typecheck:storybook
      - run: npm run typecheck:prototype
      - run: npm run build-storybook

  lint:
    name: Lint
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check agent instruction routes and budgets
        run: node scripts/check-agent-routes.mjs
      - run: npm ci --include=optional
      - run: npm run lint

  unit:
    name: Unit tests
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
      - run: npm run test:unit:coverage
      - run: npm run test:prototype
      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage-${{ github.run_id }}
          path: coverage/unit/
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Integration tests
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The auth configuration for the app under test (a per-run SESSION_SECRET,
    # AUTH_IDENTITY_ADAPTER=mock and MAILER_ADAPTER=log + INTEGRATION_TEST_RUN=1, this allowlist) is set by
    # tests/integration/environment.ts, which owns it. The allowlist is repeated here so
    # this file visibly holds only a fake address: real operator emails live in
    # deployment configuration alone. The Build job deliberately sets no auth env —
    # a production build must not need any.
    env:
      OPERATOR_EMAILS: mock-operator@devmentor.test
      INVITATION_TTL_DAYS: '14'
      MENTOR_PUBLISH_WINDOW_DAYS: '14'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional

      - name: Cache agent-browser Chrome
        uses: actions/cache@v5
        with:
          path: ~/.agent-browser
          key: agent-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            agent-browser-${{ runner.os }}-

      - name: Install agent-browser Chrome and Linux dependencies
        run: npm run test:browser:install:ci

      # Testcontainers owns the ephemeral PostgreSQL instance. The integration
      # global setup migrates/seeds it, builds and boots Next.js, waits for a
      # database-ready health response, and cleans up every process/container.
      - run: npm run test:integration

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-evidence-${{ github.run_id }}
          path: test-results/integration/
          if-no-files-found: ignore
          retention-days: 7
