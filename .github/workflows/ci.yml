name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Runner OS is pinned (not `ubuntu-latest`) so image migrations are deliberate: bump
# every `runs-on` together and watch the integration job (Chrome path, Docker version).

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only changes (Markdown, .ai/, docs/) skip every other job. A job skipped through
  # `if:` reports success, so required checks still pass; `paths-ignore` on the workflow
  # would instead leave required checks pending forever on docs-only PRs.
  changes:
    runs-on: ubuntu-26.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: filter
        env:
          # PRs: the whole PR (merge base → head), not just the latest push, so the head
          # commit's checks always reflect every change in the PR.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # Unknown base (new branch, force push): run everything.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code_files=$(git diff --name-only "$BASE...$HEAD" | grep -v -E '(^|/)[^/]+\.md$|^\.ai/|^docs/' || true)
          echo "Non-docs changes:"; echo "${code_files:-(none)}"
          echo "code=$([ -n "$code_files" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint
      # Design system: the agent reference's component table must match the Storybook inventory.
      - run: npm run check:agent-doc

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run typecheck

  unit:
    name: unit (100% coverage)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run test:coverage
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      # Must succeed with no database reachable (AGENTS.md).
      - run: npm run build

  audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run audit

  integration:
    name: integration (testcontainers + agent-browser)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      # The runner image ships Google Chrome and its libraries. `agent-browser install
      # --with-deps` is not used here: its extra apt font packages stalled on the mirror.
      AGENT_BROWSER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: google-chrome --version
      - run: npm run build
        timeout-minutes: 5
      # Postgres comes from testcontainers (Docker is preinstalled on the runner image).
      - run: npm run test:integration
        timeout-minutes: 10
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-artifacts
          path: tests/integration/.artifacts/
          if-no-files-found: ignore

  storybook:
    name: storybook (light + dark)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      # Browser for @vitest/browser-playwright, matching the installed Playwright version.
      # No `--with-deps`: the runner image already has Chromium's system libraries, and
      # apt font installs have stalled CI before (.ai/lessons.md, 2026-10-23).
      - run: npx playwright install chromium
        timeout-minutes: 5
      # One run covers both themes: vitest.storybook.config.ts defines a
      # storybook-light and a storybook-dark project.
      - run: npm run test:storybook
        timeout-minutes: 10
      # Vitest browser mode screenshots failed tests into `__screenshots__/` next to
      # each story file.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: storybook-failure-screenshots
          path: packages/ui/storybook/**/__screenshots__/
          if-no-files-found: ignore
