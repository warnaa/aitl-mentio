name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run typecheck

  unit:
    name: unit (100% coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run test:coverage
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      # Must succeed with no database reachable (AGENTS.md).
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run audit

  integration:
    name: integration (testcontainers + agent-browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # ubuntu-latest ships Google Chrome and its libraries. `agent-browser install
      # --with-deps` is not used here: its extra apt font packages stalled on the mirror.
      AGENT_BROWSER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: google-chrome --version
      - run: npm run build
        timeout-minutes: 5
      # Postgres comes from testcontainers (Docker is preinstalled on ubuntu-latest).
      - run: npm run test:integration
        timeout-minutes: 10
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts
          path: tests/integration/.artifacts/
          if-no-files-found: ignore
