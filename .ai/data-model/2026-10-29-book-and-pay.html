<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Data model — Book and pay (E02)</title>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #fafafa; }
  header { padding: 8px 12px; font-size: 14px; border-bottom: 1px solid #ddd; background: #fff; }
  svg { width: 100%; height: calc(100% - 38px); cursor: grab; display: block; }
  svg.dragging { cursor: grabbing; }
  .node rect { rx: 8; ry: 8; stroke-width: 1.5; }
  .node.new rect { fill: #2f6feb; stroke: #1b4fb0; }
  .node.existing rect { fill: #e5e7eb; stroke: #9ca3af; }
  .node.planned rect { fill: #fff; stroke: #2f6feb; stroke-dasharray: 4 3; }
  .node text { font-size: 13px; pointer-events: none; }
  .node.new text { fill: #fff; }
  .node.existing text, .node.planned text { fill: #111; }
  .node .title { font-weight: 600; font-size: 14px; }
  .edge line { stroke: #555; stroke-width: 1.4; }
  .edge.soft line { stroke-dasharray: 5 4; }
  .edge text { font-size: 11px; fill: #333; }
  .dim { opacity: 0.15; }
</style>
</head>
<body>
<header>Book and pay (E02) — drag to pan, wheel to zoom, click a node to focus on its neighbours (click the background to reset). Authoritative diagram: the Mermaid graph in <code>.ai/specs/2026-10-29-book-and-pay.md</code>.</header>
<svg id="graph" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><g id="viewport"></g></svg>
<script type="application/json" id="graph-data">
{"nodes":[
 {"id":"entity_1","label":"Booking","kind":"new","x":420,"y":260,"fields":["mentee_id, mentor_id; slot_id nullable","starts_at, length_minutes","question (sensitive)","price_grosze, commission_bps","price_notice_from_grosze, revision","status, hold_expires_at","paid_at, cancelled_at"]},
 {"id":"entity_2","label":"PaymentOperation","kind":"new","x":780,"y":120,"fields":["kind charge|refund","reference (booking:id)","idempotency_key (unique)","amount_grosze, charge_ref","description (immutable, charges)","status, provider_ref"]},
 {"id":"entity_3","label":"MentorEarning","kind":"new","x":780,"y":420,"fields":["booking_id (unique)","mentor_id","price/commission/share grosze","reason"]},
 {"id":"entity_4","label":"User","kind":"existing","x":420,"y":560,"fields":["id","email, name"]},
 {"id":"entity_5","label":"Slot (E01, gains heldBy / heldUntil)","kind":"planned","x":60,"y":260,"fields":["mentor_id, starts_at","held_by_id (unique, nullable)","held_until: unpaid expiry / start / null"]}
],
"edges":[
 {"from":"entity_1","to":"entity_4","label":"n-1 mentee","offset":-40},
 {"from":"entity_1","to":"entity_4","label":"n-1 mentor","offset":40},
 {"from":"entity_1","to":"entity_5","label":"n-1 slot","offset":-30},
 {"from":"entity_5","to":"entity_1","label":"1-1 heldBy (nullable)","offset":30},
 {"from":"entity_2","to":"entity_1","label":"reference = booking:id (no FK)","soft":true,"offset":0},
 {"from":"entity_3","to":"entity_1","label":"1-1 booking","offset":0},
 {"from":"entity_3","to":"entity_4","label":"n-1 mentor","offset":0}
]}
</script>
<script>
(function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var data = JSON.parse(document.getElementById("graph-data").textContent);
  var svg = document.getElementById("graph");
  var vp = document.getElementById("viewport");
  var W = 250, LINE = 18;
  var byId = {};

  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    Object.keys(attrs).forEach(function (k) { e.setAttribute(k, String(attrs[k])); });
    if (parent) parent.appendChild(e);
    return e;
  }

  data.nodes.forEach(function (n) {
    n.h = 34 + n.fields.length * LINE;
    n.cx = n.x + W / 2; n.cy = n.y + n.h / 2;
    byId[n.id] = n;
  });

  var edgeEls = [];
  data.edges.forEach(function (e) {
    var a = byId[e.from], b = byId[e.to];
    var dx = b.cx - a.cx, dy = b.cy - a.cy, len = Math.sqrt(dx * dx + dy * dy) || 1;
    var ox = -dy / len * (e.offset || 0), oy = dx / len * (e.offset || 0);
    function clip(n, tx, ty, sign) {
      var hx = W / 2, hy = n.h / 2, s = Math.min(hx / Math.abs(tx || 1e-9), hy / Math.abs(ty || 1e-9));
      return [n.cx + ox + sign * tx * s, n.cy + oy + sign * ty * s];
    }
    var p1 = clip(a, dx, dy, 1), p2 = clip(b, dx, dy, -1);
    var g = el("g", { "class": "edge" + (e.soft ? " soft" : "") }, vp);
    el("line", { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], "marker-end": "url(#arrow)" }, g);
    var t = el("text", { x: (p1[0] + p2[0]) / 2 + 4, y: (p1[1] + p2[1]) / 2 - 4 }, g);
    t.textContent = e.label;
    edgeEls.push({ g: g, from: e.from, to: e.to });
  });

  var nodeEls = {};
  data.nodes.forEach(function (n) {
    var g = el("g", { "class": "node " + n.kind, transform: "translate(" + n.x + "," + n.y + ")" }, vp);
    el("rect", { width: W, height: n.h }, g);
    var title = el("text", { x: 10, y: 22, "class": "title" }, g);
    title.textContent = n.label;
    n.fields.forEach(function (f, i) {
      var t = el("text", { x: 10, y: 44 + i * LINE }, g);
      t.textContent = f;
    });
    g.addEventListener("click", function (ev) { ev.stopPropagation(); focus(n.id); });
    nodeEls[n.id] = g;
  });

  function focus(id) {
    var keep = {}; keep[id] = true;
    edgeEls.forEach(function (e) {
      var on = e.from === id || e.to === id;
      if (on) { keep[e.from] = true; keep[e.to] = true; }
      e.g.classList.toggle("dim", !on);
    });
    Object.keys(nodeEls).forEach(function (k) { nodeEls[k].classList.toggle("dim", !keep[k]); });
  }
  function reset() {
    edgeEls.forEach(function (e) { e.g.classList.remove("dim"); });
    Object.keys(nodeEls).forEach(function (k) { nodeEls[k].classList.remove("dim"); });
  }

  var view = { x: 20, y: 20, k: 1 }, drag = null;
  function apply() { vp.setAttribute("transform", "translate(" + view.x + "," + view.y + ") scale(" + view.k + ")"); }
  svg.addEventListener("mousedown", function (ev) { drag = { x: ev.clientX - view.x, y: ev.clientY - view.y, moved: false }; svg.classList.add("dragging"); });
  window.addEventListener("mousemove", function (ev) {
    if (!drag) return;
    drag.moved = true; view.x = ev.clientX - drag.x; view.y = ev.clientY - drag.y; apply();
  });
  window.addEventListener("mouseup", function () { svg.classList.remove("dragging"); setTimeout(function () { drag = null; }, 0); });
  svg.addEventListener("click", function () { if (!drag || !drag.moved) reset(); });
  svg.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    var r = svg.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
    var f = ev.deltaY < 0 ? 1.1 : 1 / 1.1, k = Math.min(4, Math.max(0.3, view.k * f));
    view.x = mx - (mx - view.x) * (k / view.k); view.y = my - (my - view.y) * (k / view.k); view.k = k; apply();
  }, { passive: false });
  apply();
})();
</script>
</body>
</html>
